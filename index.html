<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celengan Impian</title>
<style>
:root{--bg:#fff4e6;--bg2:#ffd9ec;--card:rgba(255,255,255,.75);--ink:#2b1b3d;--mute:#7b6a8d;--pri:#7c3aed;--pri2:#ec4899;--ok:#059669;--bad:#dc2626;--line:rgba(43,27,61,.12);--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140e22;--bg2:#2b1042;--card:rgba(255,255,255,.08);--ink:#f6efff;--mute:#b5a6cc;--ok:#34d399;--bad:#f87171;--line:rgba(255,255,255,.14);--inp:#241838;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140e22;--bg2:#2b1042;--card:rgba(255,255,255,.08);--ink:#f6efff;--mute:#b5a6cc;--ok:#34d399;--bad:#f87171;--line:rgba(255,255,255,.14);--inp:#241838;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
body::before{background:var(--pri);top:-110px;left:-90px}
body::after{background:var(--pri2);bottom:-120px;right:-100px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 90px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
h1 span{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;width:42px;height:42px;font-size:18px;cursor:pointer}
.hero{margin-top:16px;padding:18px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b);box-shadow:0 14px 30px -12px rgba(124,58,237,.6);position:relative;overflow:hidden}
.hero::after{content:"🐷";position:absolute;right:-6px;bottom:-16px;font-size:92px;opacity:.22;transform:rotate(-12deg)}
.hero small{opacity:.85;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hero b{display:block;font-size:30px;margin:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.22);padding:5px 11px;border-radius:99px;font-size:12px;backdrop-filter:blur(6px)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.gc{flex:0 0 128px;padding:12px;border-radius:20px;background:var(--card);border:2px solid transparent;cursor:pointer;backdrop-filter:blur(8px);text-align:left;color:var(--ink);font:inherit;transition:transform .2s}
.gc:active{transform:scale(.96)}
.gc.on{border-color:var(--c1);box-shadow:0 8px 20px -10px var(--c1)}
.gc .e{font-size:26px}
.gc .n{font-weight:700;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px}
.gc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--mute);font-size:13px;gap:2px}
.gc.add .e{font-size:28px;color:var(--pri)}
.card{margin-top:14px;padding:18px;border-radius:26px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px)}
.det{display:flex;gap:16px;align-items:center}
.jar{flex:0 0 118px;height:150px;border-radius:22px 22px 34px 34px;border:4px solid var(--line);position:relative;overflow:hidden;background:var(--inp)}
.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--c1),var(--c2));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.water::before{content:"";position:absolute;top:-12px;left:-30%;width:160%;height:24px;background:var(--c1);border-radius:45%;animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-18%)}}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.35);color:#fff;mix-blend-mode:normal}
.info{flex:1;min-width:0}
.info h2{margin:0;font-size:19px}
.big{font-size:22px;font-weight:800;margin:6px 0 0}
.of{color:var(--mute);font-size:13px}
.tip{margin-top:10px;font-size:12.5px;padding:8px 10px;border-radius:12px;background:var(--line)}
.miles{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
.ms{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:12px;background:var(--line);color:var(--mute)}
.ms.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:700}
.acts{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:16px;padding:13px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 8px 18px -8px var(--pri)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.red{background:var(--bad);box-shadow:none}
.btn:active{transform:scale(.97)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd h3{margin:0;font-size:17px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:5px 11px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.day{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.tx{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tx .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex:0 0 38px}
.tx .ic.in{background:rgba(16,185,129,.18)}
.tx .ic.out{background:rgba(239,68,68,.18)}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m span{font-size:11.5px;color:var(--mute)}
.tx .a{font-weight:800;font-size:14px}
.tx .a.in{color:var(--ok)}
.tx .a.out{color:var(--bad)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;padding:4px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.empty .e{font-size:46px;display:block;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,5,20,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 5px}
input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;font-size:16px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{font-size:22px;width:44px;height:44px;border-radius:13px;border:2px solid transparent;background:var(--inp);cursor:pointer}
.emo button.on{border-color:var(--pri)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qk button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:6px}
.pop{position:fixed;z-index:30;pointer-events:none;font-size:24px;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.water::before,.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Celengan <span>Impian</span></h1><div class="sub">Nabung dikit-dikit, impian kebeli</div></div>
    <button class="ib" id="th" aria-label="Ganti tema">🌓</button>
  </div>
  <div class="hero" id="hero"></div>
  <div class="strip" id="strip"></div>
  <div id="detail"></div>
  <div class="card">
    <div class="hd"><h3>🧾 Riwayat</h3>
      <div class="seg"><button id="hg">Target ini</button><button id="ha">Semua</button></div>
    </div>
    <div id="hist"></div>
  </div>
</div>
<div id="modal"></div>
<script>
const COL=[["#7c3aed","#ec4899"],["#0ea5e9","#22d3ee"],["#f59e0b","#f43f5e"],["#10b981","#84cc16"],["#6366f1","#a855f7"],["#ef4444","#f97316"]];
const EMO=["🏍️","📱","💻","✈️","🏠","🎓","🎮","👟","💍","🚗","🎁","🏖️","📷","🐶","💰","🎸"];
let S={goals:[],tx:[],sel:null},hf="goal";
try{const r=localStorage.getItem("celengan-impian");if(r){const p=JSON.parse(r);if(p&&p.goals&&p.tx)S=p}}catch(e){}
const save=()=>{try{localStorage.setItem("celengan-impian",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const saved=g=>S.tx.filter(t=>t.gid===g.id).reduce((a,t)=>a+(t.type==="in"?t.amt:-t.amt),0);
const cur=()=>S.goals.find(g=>g.id===S.sel)||S.goals[0];
const sty=g=>`--c1:${COL[g.ci][0]};--c2:${COL[g.ci][1]}`;
const fd=ts=>new Date(ts).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const ft=ts=>new Date(ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});

function render(){
  const tot=S.goals.reduce((a,g)=>a+saved(g),0);
  const done=S.goals.filter(g=>saved(g)>=g.target).length;
  $("#hero").innerHTML=`<small>Total tabungan</small><b>${rp(tot)}</b><div class="chips"><span class="chip">🎯 ${S.goals.length} target</span><span class="chip">🏆 ${done} tercapai</span><span class="chip">🧾 ${S.tx.length} transaksi</span></div>`;
  const c=cur();
  $("#strip").innerHTML=S.goals.map(g=>{const p=Math.min(100,saved(g)/g.target*100);return `<button class="gc ${c&&c.id===g.id?"on":""}" style="${sty(g)}" data-g="${g.id}"><div class="e">${g.emoji}</div><div class="n">${esc(g.name)}</div><div class="mini"><i style="width:${p}%"></i></div></button>`}).join("")+`<button class="gc add" id="addg"><span class="e">＋</span>Target baru</button>`;
  if(!c){$("#detail").innerHTML=`<div class="card empty"><span class="e">🐷</span>Belum ada target. Yuk bikin target pertamamu, misalnya motor, HP baru, atau liburan!</div>`}
  else{
    const s=saved(c),p=Math.max(0,Math.min(100,s/c.target*100)),rem=Math.max(0,c.target-s);
    let tip="";
    if(s>=c.target)tip="🎉 Target tercapai! Selamat, impianmu udah kebeli.";
    else if(c.deadline){const d=Math.ceil((new Date(c.deadline+"T23:59:59")-Date.now())/864e5);tip=d>0?`⏳ ${d} hari lagi. Sisihkan sekitar <b>${rp(rem/d)}</b> per hari atau <b>${rp(rem/Math.max(1,Math.ceil(d/7)))}</b> per minggu.`:"⚠️ Batas waktu sudah lewat, geser target atau tambah nabungan ya."}
    else tip=`💡 Kurang <b>${rp(rem)}</b> lagi. Nabung rutin walau kecil pasti sampai.`;
    $("#detail").innerHTML=`<div class="card" style="${sty(c)}"><div class="det"><div class="jar"><div class="water" data-h="${p}"></div><div class="pct">${Math.floor(p)}%</div></div><div class="info"><h2>${c.emoji} ${esc(c.name)}</h2><div class="big">${rp(s)}</div><div class="of">dari ${rp(c.target)}</div><div class="tip">${tip}</div></div></div>
    <div class="miles">${[25,50,75,100].map(m=>`<div class="ms ${p>=m?"on":""}">${m>=100?"🏆":"⭐"} ${m}%</div>`).join("")}</div>
    <div class="acts"><button class="btn" id="bin">＋ Nabung</button><button class="btn alt" id="bout">− Tarik</button><button class="btn alt" id="bdel" style="flex:0 0 52px" aria-label="Hapus target">🗑️</button></div></div>`;
    setTimeout(()=>{const w=$(".water");if(w)w.style.height=w.dataset.h+"%"},60);
  }
  $("#hg").className=hf==="goal"?"on":"";$("#ha").className=hf==="all"?"on":"";
  let list=[...S.tx].sort((a,b)=>b.ts-a.ts);
  if(hf==="goal"&&c)list=list.filter(t=>t.gid===c.id);
  if(!list.length){$("#hist").innerHTML=`<div class="empty"><span class="e">📭</span>Belum ada riwayat. Mulai nabung dulu yuk!</div>`;return}
  let last="",h="";
  for(const t of list){
    const d=fd(t.ts);if(d!==last){h+=`<div class="day">${d}</div>`;last=d}
    const g=S.goals.find(x=>x.id===t.gid);
    h+=`<div class="tx"><div class="ic ${t.type}">${t.type==="in"?"🪙":"💸"}</div><div class="m"><b>${esc(t.note||(t.type==="in"?"Nabung":"Tarik dana"))}</b><span>${ft(t.ts)}${hf==="all"&&g?" · "+g.emoji+" "+esc(g.name):""}</span></div><div class="a ${t.type}">${t.type==="in"?"+":"−"}${rp(t.amt)}</div><button class="x" data-t="${t.id}" aria-label="Hapus">✕</button></div>`;
  }
  $("#hist").innerHTML=h;
}

function openM(html){$("#modal").innerHTML=`<div class="ov" id="ov"><div class="sheet">${html}</div></div>`;$("#ov").onclick=e=>{if(e.target.id==="ov")closeM()}}
function closeM(){$("#modal").innerHTML=""}
function pop(){const em=["🪙","✨","💰","🎉","⭐"];for(let i=0;i<18;i++){const s=document.createElement("span");s.className="pop";s.textContent=em[i%em.length];s.style.left="50%";s.style.top="45%";s.style.setProperty("--dx",(Math.random()*320-160)+"px");s.style.setProperty("--dy",(Math.random()*-300-30)+"px");s.style.setProperty("--r",(Math.random()*540-270)+"deg");document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}

function goalForm(){
  let ei=0;
  openM(`<h3>🎯 Target baru</h3><label>Nama target</label><input id="gn" placeholder="Contoh: Motor impian" maxlength="30"><label>Pilih ikon</label><div class="emo" id="eg">${EMO.map((e,i)=>`<button type="button" data-i="${i}" class="${i===0?"on":""}">${e}</button>`).join("")}</div><label>Nominal target (Rp)</label><input id="gt" type="number" inputmode="numeric" placeholder="15000000"><label>Batas waktu (opsional)</label><input id="gd" type="date"><div class="err" id="er"></div><div class="acts"><button class="btn alt" id="cx">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  $("#eg").onclick=e=>{const b=e.target.closest("button");if(!b)return;ei=+b.dataset.i;[...$("#eg").children].forEach((x,i)=>x.classList.toggle("on",i===ei))};
  $("#cx").onclick=closeM;
  $("#ok").onclick=()=>{
    const n=$("#gn").value.trim(),t=+$("#gt").value;
    if(!n){$("#er").textContent="Nama target wajib diisi.";return}
    if(!(t>0)){$("#er").textContent="Nominal target harus lebih dari 0.";return}
    const g={id:uid(),name:n,emoji:EMO[ei],target:t,deadline:$("#gd").value||"",ci:S.goals.length%COL.length};
    S.goals.push(g);S.sel=g.id;save();closeM();render();
  };
}
function txForm(type){
  const c=cur();if(!c)return;const inn=type==="in";
  openM(`<h3>${inn?"🪙 Nabung ke":"💸 Tarik dari"} ${c.emoji} ${esc(c.name)}</h3><label>Nominal (Rp)</label><input id="ta" type="number" inputmode="numeric" placeholder="50000"><div class="qk">${[10000,50000,100000,500000].map(v=>`<button type="button" data-v="${v}">${rp(v)}</button>`).join("")}</div><label>Catatan (opsional)</label><input id="tn" maxlength="40" placeholder="${inn?"Sisa uang jajan, bonus, dll":"Alasan tarik dana"}"><div class="err" id="er"></div><div class="acts"><button class="btn alt" id="cx">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  document.querySelector(".qk").onclick=e=>{const b=e.target.closest("button");if(b)$("#ta").value=(+$("#ta").value||0)+ +b.dataset.v};
  $("#cx").onclick=closeM;
  $("#ok").onclick=()=>{
    const a=+$("#ta").value;
    if(!(a>0)){$("#er").textContent="Isi nominal yang valid.";return}
    if(!inn&&a>saved(c)){$("#er").textContent="Saldo tidak cukup, tersisa "+rp(saved(c))+".";return}
    const was=saved(c)>=c.target;
    S.tx.push({id:uid(),gid:c.id,type,amt:a,note:$("#tn").value.trim(),ts:Date.now()});
    save();closeM();render();
    if(inn){pop();if(!was&&saved(c)>=c.target)setTimeout(pop,500)}
  };
}
function delGoal(){
  const c=cur();if(!c)return;
  openM(`<h3>Hapus target ini?</h3><p>${c.emoji} ${esc(c.name)} beserta seluruh riwayatnya akan dihapus permanen.</p><div class="acts"><button class="btn alt" id="cx">Batal</button><button class="btn red" id="ok">Hapus</button></div>`);
  $("#cx").onclick=closeM;
  $("#ok").onclick=()=>{S.tx=S.tx.filter(t=>t.gid!==c.id);S.goals=S.goals.filter(g=>g.id!==c.id);S.sel=S.goals[0]?S.goals[0].id:null;save();closeM();render()};
}

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#addg"))return goalForm();
  const g=t.closest("[data-g]");if(g){S.sel=g.dataset.g;save();render();return}
  if(t.closest("#bin"))return txForm("in");
  if(t.closest("#bout"))return txForm("out");
  if(t.closest("#bdel"))return delGoal();
  if(t.closest("#hg")){hf="goal";render();return}
  if(t.closest("#ha")){hf="all";render();return}
  const x=t.closest("[data-t]");if(x){S.tx=S.tx.filter(y=>y.id!==x.dataset.t);save();render()}
});
$("#th").onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).colorScheme==="dark";r.setAttribute("data-theme",d?"light":"dark")};
render();
</script>
</body>
</html>
